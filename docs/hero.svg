<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" role="img" aria-label="PriceCraft banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#123b36"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="880" height="300" rx="18" fill="url(#bg)"/>
  <circle cx="760" cy="60" r="140" fill="#14b8a6" opacity="0.08"/>
  <circle cx="120" cy="270" r="110" fill="#14b8a6" opacity="0.06"/>

  <!-- logo -->
  <rect x="56" y="96" width="72" height="72" rx="18" fill="url(#accent)"/>
  <text x="92" y="148" font-family="Arial, sans-serif" font-size="46" font-weight="bold" text-anchor="middle" fill="#04121f">$</text>

  <text x="150" y="128" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#e7edf7">PriceCraft</text>
  <text x="150" y="162" font-family="Arial, sans-serif" font-size="19" fill="#93a4c0">Cost-plus &amp; value-based pricing for makers</text>

  <!-- formula chips -->
  <g font-family="Consolas, monospace" font-size="14" fill="#14b8a6">
    <rect x="150" y="190" width="212" height="34" rx="9" fill="#111a2c" stroke="#24334e"/>
    <text x="162" y="212">price = cost / (1 − margin)</text>
    <rect x="376" y="190" width="236" height="34" rx="9" fill="#111a2c" stroke="#24334e"/>
    <text x="388" y="212">break-even = fixed / contribution</text>
    <rect x="626" y="190" width="204" height="34" rx="9" fill="#111a2c" stroke="#24334e"/>
    <text x="638" y="212">ref = median × multiplier</text>
  </g>

  <text x="150" y="256" font-family="Arial, sans-serif" font-size="15" fill="#93a4c0">Free · Private · Offline-first PWA · EN/PT-BR · USD EUR GBP BRL JPY INR</text>
</svg>
