<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PriceCraft - Pricing Calculator</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>PriceCraft</h1>
    <select id="locale-selector">
      <option value="en">English</option>
      <option value="pt-BR">Português</option>
    </select>
  </header>
  <main>
    <section id="calculator">
      <h2 id="calc-title">Cost-Plus Pricing</h2>
      <div class="form-group">
        <label for="cost">Cost (USD)</label>
        <input type="number" id="cost" step="0.01" placeholder="e.g. 15.50">
      </div>
      <div class="form-group">
        <label for="markup">Markup (%):</label>
        <input type="number" id="markup" step="0.1" placeholder="e.g. 30">
      </div>
      <button id="calculate" class="btn">Calculate Price</button>
    </section>
    <section id="results" style="display:none">
      <h2 id="result-title"></h2>
      <div class="price-display">$<span id="price">0.00</span></div>
      <button id="new-calc" class="btn">New Calculation</button>
    </section>
  </main>
  <footer>
    <p>Built by <a href="https://github.com/chr-z">@chr-z</a></p>
    <p>Offline-first PWA</p>
  </footer>
  <script src="js/app.js"></script>
</body>
</html>
